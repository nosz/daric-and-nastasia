*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);-webkit-text-size-adjust:100%}

/* Kopf */

.topin{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.lang button[aria-pressed="true"]{background:#fff;color:#1d2f6f}
.certitem{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.certrow{display:flex;gap:8px;align-items:stretch}.certrow .certbar{flex:1}.sharecert.sm{min-height:44px;padding:6px 14px;white-space:nowrap}

.res .bigstars span{display:inline-block;animation:star .6s both}

@keyframes star{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.res h1{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}

 cards:[
  [["Connection: das unsichtbare Kabel","Connection : le fil invisible","Connection: s unsichtbare Chabel","Connection: il cavo invisibile"],
   ["Connection heißt: körperliche, nonverbale Kommunikation zwischen den Tanzenden. Sie hält eure Bewegungen zusammen, ohne dass einer ein Wort sagt. Daric: „Connection ist wie Telefon, nur ohne Werbung, ja?“",
    "La connection, c'est la communication physique et non verbale entre les danseurs. Elle garde vos mouvements synchronisés sans que personne dise un mot. Daric : « La connection, c'est comme le téléphone, mais sans pub, non ? »",
    "Connection heisst: körperlichi, nonverbali Kommunikation zwüsche de Tanzende. Si hält euri Bewegige zäme, ohni dass eine es Wort seit. Daric: „Connection isch wie Telefon, nume ohni Werbung, non?“",
    "Connection significa comunicazione fisica e non verbale tra i ballerini. Tiene insieme i vostri movimenti senza che nessuno dica una parola. Daric: «La connection è come il telefono, ma senza pubblicità, non?»"]],
  [["Rahmen oder nur Hände","Cadre ou simples mains","Rahme oder nume Händ","Telaio o solo mani"],
   ["In geschlossener Haltung mit Körperkontakt entsteht die Connection durch den Rahmen (Frame): Arme und Oberkörper bleiben stabil, aber nicht steif, eher wie Federn als wie Besenstiele. In offener Haltung tragen allein Hände und Arme die Verbindung.",
    "En position fermée avec contact du corps, la connection passe par le cadre (frame) : bras et buste restent stables, mais pas raides, plutôt comme des ressorts que comme des manches à balai. En position ouverte, seules les mains et les bras portent la connexion.",
    "I geschlossener Haltig mit Körperkontakt entsteit d Connection dur de Rahme (Frame): Arm und Oberkörper blibe stabil, aber nöd steif, eher wie Fädere als wie Bäsestiel. I offener Haltig träge elei d Händ und d Arm d Verbindig.",
    "In posizione chiusa con contatto del corpo, la connection nasce dal telaio (frame): braccia e busto restano stabili ma non rigidi, più come molle che come manici di scopa. In posizione aperta solo mani e braccia portano la connessione."]],
  [["Tension, Compression, neutral","Tension, compression, neutre","Tension, Compression, neutral","Tension, compression, neutrale"],
   ["Wikipedia unterscheidet drei Arten: Tension (beide ziehen mit gleicher Gegenkraft voneinander weg), Compression (beide drücken aufeinander zu) und neutral (nur leichte Berührung, keine Kraft). Nastasia: „Not too much! Otherwise your partner is like furniture.“",
    "Wikipédia distingue trois formes : la tension (chacun tire vers l'extérieur avec une force égale et opposée), la compression (chacun pousse vers l'autre) et le neutre (simple toucher léger, aucune force). Nastasia : « Not too much ! Sinon ton partenaire devient un meuble. »",
    "Wikipedia unterscheidet drü Arte: Tension (beidi zieh mit gliicher Gägechraft vonenand weg), Compression (beidi drücke ufenand zue) und neutral (nume liechti Berüerig, kei Chraft). Nastasia: „Not too much! Otherwise your partner is like furniture.“",
    "Wikipedia distingue tre forme: tension (entrambi tirano verso l'esterno con forza uguale e contraria), compression (entrambi spingono l'uno verso l'altro) e neutrale (solo un tocco leggero, nessuna forza). Nastasia: «Not too much! Altrimenti il partner diventa un mobile.»"]]
 ],
 pro:["Führen ist eine Einladung, Folgen ist Zuhören. Gute Führende bewegen sich aus dem Körper mit einer Gewichtsverlagerung, der Arm folgt nur. Ein Führen allein mit dem Arm gilt als Merkmal weniger erfahrener Tänzer. Folgende bewegen sich erst, wenn die Führung wirklich kommt, und geben über die Verbindung Rückmeldung, in offener Haltung auch per Blickkontakt. Beide Rollen sind gleich wichtig und lassen sich tauschen.",
  "Mener, c'est inviter, suivre, c'est écouter. Un bon meneur bouge depuis le corps, avec un transfert de poids, et le bras suit simplement. Mener uniquement avec le bras est le signe d'un danseur moins expérimenté. Le suiveur ne bouge que lorsque l'impulsion arrive vraiment et donne un retour par la connexion, en position ouverte aussi par le regard. Les deux rôles comptent autant et peuvent s'échanger.",
  "Füehre isch e Iladig, Folge isch Zuelose. Guet Füehrendi bewege sich us em Körper mit ere Gwichtsverlagerig, de Arm folgt nume. Nume mit em Arm füehre gilt als Merkmal vo weniger erfahrene Tänzer. Folgendi bewege sich erst, wenn d Füehrig würkli chunt, und gäbe über d Verbindig Rückmäldig, i offener Haltig au dur Blickkontakt. Beidi Rolle sind glich wichtig und lönd sich tusche.",
  "Guidare è un invito, seguire è ascoltare. Chi guida bene si muove dal corpo, con uno spostamento del peso, e il braccio segue soltanto. Guidare solo con il braccio è segno di un ballerino meno esperto. Chi segue si muove solo quando l'impulso arriva davvero e dà un riscontro attraverso la connessione, in posizione aperta anche con lo sguardo. Entrambi i ruoli contano allo stesso modo e si possono scambiare."],
 fun:["Daric: „Du musst nicht ziehen, du musst einladen, ja? Wie bei Party, nicht wie bei Abschleppdienst.“ Nastasia: „Mon dieu, Daric. Poetry!“",
  "Daric : « Tu ne tires pas, tu invites, d'accord ? Comme à une fête, pas comme une dépanneuse. » Nastasia : « Mon dieu, Daric. Poetry ! »",
  "Daric: „Du muesch nid zieh, du muesch iilade, oui? Wie bi Party, nid wie bi Abschleppdienscht.“ Nastasia: „Mon dieu, Daric. Poetry!“",
  "Daric: «Non devi tirare, devi invitare, d'accord? Come a una festa, non come un carro attrezzi.» Nastasia: «Mon dieu, Daric. Poetry!»"],

{ id:"discofox", ico:"🕺", c:"var(--orange)", min:3,
 t:["Discofox: Grundschritt und Wiegeschritt","Discofox : pas de base et balancé","Discofox: Grundschritt und Wiegschritt","Discofox: passo base e passo dondolato"],
 sub:["Vier Schläge, drei Schritte, null Panik","Quatre temps, trois pas, zéro panique","Vier Schläg, drü Schritt, null Panik","Quattro battiti, tre passi, zero panico"],
 cards:[
  [["Der Takt: vier Schläge","La mesure : quatre temps","De Takt: vier Schläg","Il tempo: quattro battiti"],
   ["Discofox läuft im 4/4-Takt: vier Schläge pro Takt. Als Faustwert gelten etwa 120 Schläge pro Minute, das sind 30 Takte pro Minute. Getanzt wird zu Disco, Eurodisco, Pop und Schlager. Daric: „Die Musik hat vier Schläge, kein Geheimnis. Du zählst: eins, zwei, drei, vier, ja?“",
    "Le discofox se danse sur une mesure à 4/4 : quatre temps par mesure. Comme repère, on compte environ 120 battements par minute, soit 30 mesures par minute. On le danse sur du disco, de l'eurodisco, de la pop et de la variété. Daric : « La musique a quatre temps, pas de mystère. Tu comptes : un, deux, trois, quatre, d'accord ? »",
    "Discofox louft im 4/4-Takt: vier Schläg pro Takt. Als Faustwert gälte öppe 120 Schläg pro Minute, das sind 30 Takt pro Minute. Tanzt wird zu Disco, Eurodisco, Pop und Schlager. Daric: „D Musik het vier Schläg, kei Gheimnis. Du zählsch: eis, zwöi, drü, vier, non?“",
    "Il Discofox si balla in 4/4: quattro battiti per misura. Come regola pratica si contano circa 120 battiti al minuto, cioè 30 misure al minuto. Si balla su disco, eurodisco, pop e schlager. Daric: «La musica ha quattro tempi, nessun mistero. Conti: uno, due, tre, quattro, d'accord?»"]],
  [["Der Grundschritt: Schritt, Schritt, Tap","Le pas de base : pas, pas, tap","De Grundschritt: Schritt, Schritt, Tap","Il passo base: passo, passo, tap"],
   ["Der Grundschritt besteht aus drei Schritten: Schritt, Schritt, Tap. Der Führende beginnt mit links vorwärts, die Folgende mit rechts rückwärts. Beim Tap berührst du den Boden mit dem Fußballen, ohne Gewicht zu übernehmen. Dann geht es mit demselben Muster zurück: zusammen sind das sechs Zählzeiten.",
    "Le pas de base se compose de trois pas : pas, pas, tap. Celui qui mène commence par le pied gauche en avant, celle qui suit par le pied droit en arrière. Au tap, tu touches le sol de la pointe du pied sans y mettre ton poids. Puis tu reviens avec le même motif : cela fait six temps en tout.",
    "De Grundschritt bestoht us drü Schritt: Schritt, Schritt, Tap. De Füehrend fangt mit links vorwärts a, d Folgendi mit rächts rückwärts. Bim Tap berüehrsch du de Bode mit em Fuessballe, ohni s Gwicht z übernäh. Denn gaht s mit em gliiche Muster zrugg: zäme sind das sächs Zählzyte.",
    "Il passo base è composto da tre passi: passo, passo, tap. Chi guida parte con il sinistro in avanti, chi segue con il destro indietro. Al tap tocchi il pavimento con l'avampiede, senza trasferire il peso. Poi si torna indietro con lo stesso schema: in tutto sono sei tempi."]],
  [["Haltung und Platz","Tenue et espace","Haltig und Platz","Postura e spazio"],
   ["Ihr steht euch aufrecht gegenüber, die Füße parallel. Die linke Hand des Führenden hält die rechte Hand der Folgenden etwa auf Schulterhöhe, die rechte Hand liegt flach zwischen Schulterblatt und Hüfte. Getanzt wird nahezu auf der Stelle, das passt auch auf volle Tanzflächen. Nastasia: „Little space, big fun!“",
    "Vous vous faites face, bien droits, pieds parallèles. La main gauche de celui qui mène tient la main droite de celle qui suit à hauteur d'épaule, sa main droite repose à plat entre l'omoplate et la hanche. On danse presque sur place, ce qui convient même aux pistes bondées. Nastasia : « Little space, big fun ! »",
    "Ihr stönd eu ufrächt gägenüber, d Füess parallel. D linki Hand vom Füehrende hebt d rächt Hand vo de Folgende öppe uf Schulterhöchi, d rächt Hand liit flach zwüsche Schulterblatt und Hüfte. Tanzt wird fast uf de Stell, das passt au uf volli Tanzflächene. Nastasia: „Little space, big fun!“",
    "Siete uno di fronte all'altra, ben dritti, piedi paralleli. La mano sinistra di chi guida tiene la mano destra di chi segue circa all'altezza delle spalle, la mano destra poggia piatta tra scapola e anca. Si balla quasi sul posto, perfetto anche per le piste affollate. Nastasia: «Little space, big fun!»"]]
 ],
 pro:["Das Wiegen gibt dem Grundschritt sein Disco-Gefühl: Du verlagerst das Gewicht weich von Fuß zu Fuß und lässt die Knie locker. Der Begriff Wiegeschritt wird je nach Tanzschule unterschiedlich benutzt, ebenso die Zählweise. Manche Schulen zählen den Grundschritt über acht Schläge, in der Tabelle von Wikibooks sind es sechs Zählzeiten. Wichtig ist nur: Der Dreier-Rhythmus Schritt, Schritt, Tap bleibt den ganzen Tanz gleich. Discofox entstand Mitte der 1970er in Europa und ist besonders in Deutschland, Österreich, Polen und der Schweiz beliebt.",
  "Le balancement donne au pas de base son côté disco : tu transfères le poids en douceur d'un pied à l'autre en gardant les genoux souples. Le terme de pas balancé et la façon de compter varient selon les écoles. Certaines comptent le pas de base sur huit temps, le tableau de Wikibooks en donne six. Ce qui compte : le rythme à trois, pas, pas, tap, reste le même pendant toute la danse. Le discofox est né en Europe au milieu des années 1970 et il est surtout populaire en Allemagne, en Autriche, en Pologne et en Suisse.",
  "S Wiege git em Grundschritt sis Disco-Gfühl: Du verlagersch s Gwicht wiich vo Fuess zu Fuess und laasch d Chnöi locker. De Begriff Wiegschritt wird je nach Tanzschuel underschiedlich bruucht, genauso d Zählwiis. Es paar Schuele zähle de Grundschritt über acht Schläg, i de Tabälle vo Wikibooks sind es sächs Zählzyte. Wichtig isch nume: De Dreier-Rhythmus Schritt, Schritt, Tap blibt de ganz Tanz gliich. Discofox isch Mitti vo de 1970er i Europa entstande und isch bsunders i Dütschland, Öschtriich, Polen und de Schwiiz beliebt.",
  "Il dondolio dà al passo base il suo feeling disco: sposti il peso con morbidezza da un piede all'altro e tieni le ginocchia sciolte. Il termine passo dondolato viene usato in modo diverso a seconda della scuola, come anche il modo di contare. Alcune scuole contano il passo base su otto battiti, nella tabella di Wikibooks sono sei tempi. L'importante è solo questo: il ritmo a tre, passo, passo, tap, resta uguale per tutto il ballo. Il Discofox è nato a metà degli anni Settanta in Europa ed è particolarmente amato in Germania, Austria, Polonia e Svizzera."],
 fun:["Daric: „Discofox ist einfach: Schritt, Schritt, Tap. Nur der Tap, der ist wie Katze vor dem Wasser, ganz vorsichtig.“ Nastasia: „Et Daric? Always on beat.“",
  "Daric : « Le discofox, c'est simple : pas, pas, tap. Seul le tap est comme un chat devant l'eau, tout en prudence. » Nastasia : « Et Daric ? Always on beat. »",
  "Daric: „Discofox isch eifach: Schritt, Schritt, Tap. Nume de Tap, das isch wie d Chatz vor em Wasser, tout doucement.“ Nastasia: „Et Daric? Always on beat.“",
  "Daric: «Il Discofox è semplice: passo, passo, tap. Solo il tap è come un gatto davanti all'acqua, tout doucement.» Nastasia: «Et Daric? Always on beat.»"],

 t:["Discofox: Drehungen und Figuren","Discofox : tours et figures","Discofox: Drehige und Figure","Discofox: giri e figure"],
 sub:["Aus drei Schritten wird eine ganze Show","De trois pas à un vrai spectacle","Us drü Schritt wird e ganzi Show","Da tre passi a un vero spettacolo"],
 cards:[
  [["Variation durch Drehen","La variété par les tours","Variation dur Drehe","La varietà dei giri"],
   ["Der Grundschritt bleibt, die Abwechslung kommt aus schnellen Drehungen und Verschlingungen, nicht aus komplizierten Schritten. Seit etwa 1991 gibt es Figuren mit mehreren Drehungen über mehrere Zählzeiten. Daric: „Wenig Schritt, viel Drehung, ja? Wie Croissant.“",
    "Le pas de base reste le même, la variété vient de tours rapides et d'enlacements, pas de pas compliqués. Depuis 1991 environ, il existe des figures avec plusieurs tours sur plusieurs temps. Daric : « Peu de pas, beaucoup de tours, d'accord ? Comme un croissant. »",
    "De Grundschritt blibt, d Abwechslig chunt vo schnälle Drehige und Verschlingige, nöd vo komplizierte Schritt. Sit öppe 1991 git s Figure mit mehrere Drehige über mehreri Zählzyte. Daric: „Wenig Schritt, viel Drehung, oui? Wie Croissant.“",
    "Il passo base resta lo stesso, la varietà nasce da giri veloci e intrecci, non da passi complicati. Dal 1991 circa esistono figure con più giri su più tempi. Daric: «Pochi passi, tanti giri, d'accord? Come un croissant.»"]],
  [["Die gemeinsame 360-Grad-Drehung","Le tour à deux de 360 degrés","Di gmeinsami 360-Grad-Drehig","Il giro in coppia di 360 gradi"],
   ["Die Drehung besteht aus zwei Teilen zu je 180 Grad mit jeweils drei Zählzeiten: Der Führende dreht nach links, die Folgende nach rechts. Die Haltung wird dabei gelockert, ihr haltet nur die Hände. Dann kehrt ihr in die Tanzhaltung zurück. Nastasia: „Twice 180, then bam, 360!“",
    "Le tour comprend deux parties de 180 degrés, chacune sur trois temps : celui qui mène tourne vers la gauche, celle qui suit vers la droite. La tenue se relâche, vous ne gardez que les mains. Puis vous revenez en position de danse. Nastasia : « Twice 180, then bam, 360 ! »",
    "D Drehig bestoht us zwöi Teil zu je 180 Grad mit jewils drü Zählzyte: De Füehrend dreiht nach links, d Folgendi nach rächts. D Haltig wird dabi gglöst, ihr haltet nume d Händ. Denn chömed ihr i d Tanzhaltig zrugg. Nastasia: „Twice 180, then bam, 360!“",
    "Il giro è composto da due parti da 180 gradi, ciascuna su tre tempi: chi guida gira verso sinistra, chi segue verso destra. La postura si allenta, tenete solo le mani. Poi tornate nella posizione di ballo. Nastasia: «Twice 180, then bam, 360!»"]],
  [["Figurennamen und Sicherheit","Noms de figures et sécurité","Figurename und Sicherheit","Nomi delle figure e sicurezza"],
   ["Zu den bekannten Figuren gehören Brezel, Schmetterling, Körbchen, Schiebetür, Damensolo und Damentaucher. Bei Drehungen gilt: Der Arm des Führenden geht über den Kopf der Drehenden, so bleibt es bequem und sicher. Daric: „Erst Arm hoch, dann Dame drehen. Sonst Brezel, aber aus Mensch.“",
    "Parmi les figures connues : le bretzel, le papillon, le panier, la porte coulissante, le solo de la danseuse et le plongeon. Pour les tours, le bras de celui qui mène passe au-dessus de la tête de celle qui tourne, c'est confortable et sûr. Daric : « D'abord le bras en haut, ensuite le tour. Sinon bretzel, mais en humain. »",
    "Zu de bekannte Figure ghöre Brezel, Schmätterling, Chörbli, Schiebetüre, Damesolo und Damentaucher. Bi Drehige gilt: De Arm vom Füehrende gaht über de Chopf vo de Drehende, so blibt s bequem und sicher. Daric: „Erst Arm hoch, dänn Dame drehe. Sonscht Brezel, aber us Mensch.“",
    "Tra le figure più note ci sono il pretzel, la farfalla, il cestino, la porta scorrevole, l'assolo della dama e il tuffo della dama. Nei giri vale questa regola: il braccio di chi guida passa sopra la testa di chi gira, così è comodo e sicuro. Daric: «Prima il braccio in alto, poi la dama gira. Sennò pretzel, mais en humain.»"]]
 ],
 pro:["Im Wettbewerb kommen Showelemente dazu, bis hin zu halbakrobatischen und akrobatischen Figuren. Im Alltag ist Musikalität der bessere Trick: Setze eine Drehung auf einen Akzent der Musik und lass in ruhigen Stellen den einfachen Grundschritt tanzen. Eine gute Variation passt zum Lied, nicht zum Ehrgeiz. Für den Wechsel zwischen Figuren hilft der Grundschritt als Ruhepunkt: Er gibt beiden Zeit, wieder zusammenzufinden.",
  "En compétition, des éléments de show s'ajoutent, jusqu'aux figures semi-acrobatiques et acrobatiques. Au quotidien, la musicalité est le meilleur truc : place un tour sur un accent de la musique et garde le pas de base simple dans les passages calmes. Une bonne variation convient au morceau, pas à l'ambition. Pour enchaîner les figures, le pas de base sert de point de repos : il laisse aux deux le temps de se retrouver.",
  "Im Wettbewerb chömed Showelemänt dezue, bis zu halbakrobatische und akrobatische Figure. Im Alltag isch Musikalität de bessere Trick: Setz e Drehig uf en Akzänt vo de Musig und laa i ruhige Stelle de eifach Grundschritt tanze. E guti Variation passt zum Lied, nöd zum Ehrgiiz. Für de Wächsel zwüsche Figure hilft de Grundschritt als Ruhepunkt: Er git beidne Ziit, wieder zämezfinde.",
  "In gara si aggiungono elementi di show, fino a figure semiacrobatiche e acrobatiche. Nella pratica di tutti i giorni la musicalità è il trucco migliore: metti un giro su un accento della musica e lascia il passo base semplice nei momenti calmi. Una buona variazione si adatta al brano, non all'ambizione. Per passare da una figura all'altra il passo base fa da punto di riposo: dà a entrambi il tempo di ritrovarsi."],

  "Daric: „Hüt mached mir de Brezel!“ Nastasia: „Daric, please, not the bakery.“ Daric: „Oh là là, de Tanz-Brezel, Chérie!“",
  "Daric: «Oggi facciamo il pretzel!» Nastasia: «Daric, please, not the bakery.» Daric: «Oh là là, il pretzel di danza, chérie!»"],

{ id:"wcs", ico:"🎷", c:"var(--green)", min:3,
 t:["West Coast Swing: Slot und Anker","West Coast Swing : slot et ancrage","West Coast Swing: Slot und Anker","West Coast Swing: slot e anchor"],
 sub:["Der Gummiband-Tanz von der Westküste","La danse élastique de la côte ouest","De Gummiband-Tanz vo de Weschtchüste","Il ballo elastico della West Coast"],
 cards:[
  [["Von der Westküste","Venue de la côte ouest","Vo de Weschtchüste","Dalla costa ovest"],
   ["West Coast Swing wurzelt im Lindy Hop und entwickelte sich in den 1940er- und 1950er-Jahren rund um die Westküste der USA. Den Namen benutzte Skippy Blair um 1958 bis 1962, und 1988 wurde der Tanz zum offiziellen Tanz des Staates Kalifornien. Also: Sonne, Strand und ein Tanz mit Stil.",
    "Le West Coast Swing a ses racines dans le lindy hop et s'est développé dans les années 1940 et 1950 autour de la côte ouest des États-Unis. Skippy Blair a utilisé le nom vers 1958-1962, et en 1988 la danse est devenue la danse officielle de l'État de Californie. Donc : soleil, plage et une danse avec du style.",
    "West Coast Swing het sini Wurzle im Lindy Hop und het sich i de 1940er- und 1950er-Jahr rund um d Weschtchüste vo de USA entwickelt. De Name hät d Skippy Blair um 1958 bis 1962 bruucht, und 1988 isch de Tanz zum offizielle Tanz vom Staat Kalifornie worde. Also: Sunne, Strand und en Tanz mit Stil.",
    "Il West Coast Swing ha le radici nel lindy hop e si è sviluppato negli anni Quaranta e Cinquanta attorno alla costa ovest degli Stati Uniti. Skippy Blair usò il nome intorno al 1958-1962 e nel 1988 il ballo è diventato il ballo ufficiale dello Stato della California. Quindi: sole, spiaggia e un ballo con stile."]],
  [["Der Slot","Le slot","De Slot","Lo slot"],
   ["Getanzt wird im Slot: einer langen, schmalen, rechteckigen Bahn auf der Tanzfläche, bei langsamer Musik etwa acht bis neun Fuß (rund 2,5 Meter) lang. Die folgende Person pendelt darin hin und her, die führende bleibt fast an Ort und Stelle. Stell dir einen Flur vor: Niemand läuft durch die Wand, alle bleiben auf dem Teppich.",
    "On danse dans le slot : une piste longue, étroite et rectangulaire sur la piste de danse, d'environ huit à neuf pieds (près de 2,5 mètres) pour une musique lente. La personne qui suit fait des allers-retours, celle qui mène bouge à peine. Imagine un couloir : personne ne traverse le mur, tout le monde reste sur le tapis.",
    "Tanzt wird im Slot: ere lange, schmale, rechteckige Bahn uf de Tanzfläche, bi langsamer Musig öppe acht bis nün Fuess (rund 2,5 Meter) lang. D Person, wo folgt, pendlet drin hin und her, d Person, wo füehrt, blibt fasch am gliiche Ort. Stell dir en Gang vor: Niemert louft dür d Wand, alli blibed uf em Teppich.",
    "Si balla nello slot: una pista lunga, stretta e rettangolare sulla pista da ballo, di circa otto-nove piedi (quasi 2,5 metri) con musica lenta. La persona che segue va avanti e indietro, quella che guida si muove appena. Immagina un corridoio: nessuno attraversa il muro, tutti restano sul tappeto."]],
  [["Sechs Zählzeiten und der Anker","Six temps et l'ancrage","Sächs Zählzyte und de Anker","Sei tempi e l'ancoraggio"],
   ["Das Basic hat sechs Zählzeiten und acht Schritte: step, step, triple-step, triple-step. Die vier Grundfiguren sind Starter Step, Side Pass, Sugar Push (auch Push Break) und der Whip mit acht Zählzeiten. Fast jede Figur endet im Anchor Step, einem Triple Step auf der Stelle, der die Verbindung wieder festigt.",
    "Le basique compte six temps et huit pas : step, step, triple-step, triple-step. Les quatre figures de base sont le Starter Step, le Side Pass, le Sugar Push (aussi Push Break) et le Whip, qui compte huit temps. Presque chaque figure se termine par l'Anchor Step, un triple step sur place qui rétablit la connexion.",
    "S Basic het sächs Zählzyte und acht Schritt: step, step, triple-step, triple-step. Di vier Grundfigure sind Starter Step, Side Pass, Sugar Push (au Push Break gnännt) und de Whip mit acht Zählzyte. Fasch jedi Figur ändet im Anchor Step, emene Triple Step uf de Stell, wo d Verbindig wieder festigt.",
    "Il basic ha sei tempi e otto passi: step, step, triple-step, triple-step. Le quattro figure di base sono lo Starter Step, il Side Pass, il Sugar Push (anche Push Break) e il Whip, che dura otto tempi. Quasi ogni figura finisce con l'Anchor Step, un triple step sul posto che ristabilisce la connessione."]]
 ],
 pro:["Das Gummiband-Prinzip heißt Extension und Compression: Die Verbindung wird lang gezogen (Extension) und mit festen, aber flexiblen Armen wieder mit Widerstand gefüllt (Compression), etwa im Sugar Push. Das gibt dem Tanz den elastischen Look. Beim Side Pass wird die folgende Person zum anderen Ende des Slots geführt und passiert die führende Person rechts (Underarm Pass) oder links. Im Sugar Push geht sie ins Halten und zurück zum selben Ende, im Whip wird sie nach dem Passieren zurück zum Startende geleitet.",
  "Le principe de l'élastique s'appelle extension et compression : la connexion s'étire (extension) puis retrouve de la résistance grâce à des bras fermes mais souples (compression), par exemple dans le Sugar Push. Cela donne à la danse son look élastique. Dans le Side Pass, la personne qui suit est menée à l'autre bout du slot et passe la personne qui mène à droite (underarm pass) ou à gauche. Dans le Sugar Push, elle entre en tenue et revient au même bout, dans le Whip elle est ramenée vers le bout de départ après le passage.",
  "S Gummiband-Prinzip heisst Extension und Compression: D Verbindig wird lang zoge (Extension) und mit feschte, aber flexible Arm wieder mit Widerstand gfüllt (Compression), zum Bispil im Sugar Push. Das git em Tanz de elastisch Look. Bim Side Pass wird di folgendi Person zum andere Änd vom Slot gfüehrt und gaat rechts (Underarm Pass) oder links a de füehrende Person verbii. Im Sugar Push gaat si is Halte und zrugg zum gliiche Änd, im Whip wird si nach em Passiere zrugg zum Startänd gleitet.",
  "Il principio dell'elastico si chiama extension e compression: la connessione si allunga (extension) e poi ritrova resistenza grazie a braccia ferme ma flessibili (compression), per esempio nel Sugar Push. Questo dà al ballo il suo look elastico. Nel Side Pass chi segue viene guidato all'altro capo dello slot e supera chi guida a destra (underarm pass) o a sinistra. Nel Sugar Push va in tenuta e torna allo stesso capo, nel Whip viene riportato verso il capo di partenza dopo il passaggio."],
 fun:["Daric: Der Slot ist wie die Flur: du gehst hin, du gehst zurück, nie durch die Wand, ja? Nastasia: Daric, slowly! The wall is new, bitte.",
  "Daric : Le slot, c'est comme un couloir : tu vas, tu reviens, jamais à travers le mur, ok ? Nastasia : Daric, doucement ! Le mur est tout neuf, s'il te plaît.",
  "Daric: De Slot isch wie en Korridor: du gehsch hin, du gehsch zrugg, nie dür d Wand, voilà? Nastasia: Daric, slowly! The wall is new, bitte.",
  "Daric: Lo slot è come un corridoio: vai, torni, mai attraverso il muro, no? Nastasia: Daric, slowly! Il muro è nuovo di zecca, please."],
 src:[["Wikipedia: West Coast Swing","https://en.wikipedia.org/wiki/West_Coast_Swing"],["Round Dancing: A Few Notes On West Coast Swing","https://rounddancing.net/dance/articles/guest/finch/afewnotesonwcs.html"]],
 q:[
  {q:["Wie viele Zählzeiten hat das Basic mit Sugar Push und Side Pass?","Combien de temps compte le basique avec Sugar Push et Side Pass ?","Wie viel Zählzyte het s Basic mit Sugar Push und Side Pass?","Quanti tempi ha il basic con Sugar Push e Side Pass?"],
   a:[["Sechs Zählzeiten","Six temps","Sächs Zählzyte","Sei tempi"],
      ["Vier Zählzeiten","Quatre temps","Vier Zählzyte","Quattro tempi"],
      ["Acht Zählzeiten","Huit temps","Acht Zählzyte","Otto tempi"],
      ["Zehn Zählzeiten","Dix temps","Zäh Zählzyte","Dieci tempi"]],
   e:["Sechs Zählzeiten, acht Schritte: step, step, triple, triple. Der Whip dagegen hat acht Zählzeiten.","Six temps, huit pas : step, step, triple, triple. Le Whip, lui, compte huit temps.","Sächs Zählzyte, acht Schritt: step, step, triple, triple. De Whip het dergäge acht Zählzyte.","Sei tempi, otto passi: step, step, triple, triple. Il Whip, invece, dura otto tempi."]},
  {q:["Was ist beim West Coast Swing der Slot?","Qu'est-ce que le slot dans le West Coast Swing ?","Was isch de Slot bim West Coast Swing?","Che cos'è lo slot nel West Coast Swing?"],
   a:[["Eine lange, schmale Bahn, in der getanzt wird","Une piste longue et étroite où l'on danse","Ei lengi, schmali Bahn, uf dere tanzt wird","Una pista lunga e stretta dove si balla"],
      ["Ein großer Kreis um die Tanzfläche","Un grand cercle autour de la piste","En grosse Chreis um d Tanzfläche","Un grande cerchio intorno alla pista"],
      ["Das Tempo, in dem der Song läuft","Le tempo auquel la chanson est jouée","S Tempo, i dem de Song louft","Il tempo a cui va la canzone"],
      ["Eine Drehung unter dem Arm","Un tour sous le bras","E Drehig under em Arm","Un giro sotto il braccio"]],
   e:["Der Slot ist eine lange, schmale, rechteckige Bahn. Die folgende Person pendelt darin, die führende bleibt fast stehen.","Le slot est une piste longue, étroite et rectangulaire. La personne qui suit y fait des allers-retours, celle qui mène bouge à peine.","De Slot isch e lengi, schmali, rechteckigi Bahn. D folgend Person pendlet drin, d füehrend blibt fasch stah.","Lo slot è una pista lunga, stretta e rettangolare. Chi segue ci va avanti e indietro, chi guida resta quasi fermo."]},
  {q:["Wie endet fast jede West-Coast-Swing-Figur?","Comment se termine presque chaque figure de West Coast Swing ?","Wie ändet fasch jedi West-Coast-Swing-Figur?","Come finisce quasi ogni figura di West Coast Swing?"],
   a:[["Mit dem Anchor Step, einem Triple Step auf der Stelle","Par l'Anchor Step, un triple step sur place","Mit em Anchor Step, emene Triple Step uf de Stell","Con l'Anchor Step, un triple step sul posto"],
      ["Mit einem Sprung in die Luft","Par un saut en l'air","Mit emene Sprung i d Luft","Con un salto in aria"],
      ["Mit einem Starter Step","Par un Starter Step","Mit emene Starter Step","Con uno Starter Step"],
      ["Mit vier Zählzeiten Pause","Par une pause de quatre temps","Mit vier Zählzyte Pause","Con una pausa di quattro tempi"]],
   e:["Der Anchor Step beendet fast jede Figur: ein Triple Step auf der Stelle, der die Verbindung wieder festigt.","L'Anchor Step termine presque chaque figure : un triple step sur place qui rétablit la connexion.","De Anchor Step schliesst fasch jedi Figur ab: en Triple Step uf de Stell, wo d Verbindig wieder festigt.","L'Anchor Step chiude quasi ogni figura: un triple step sul posto che ristabilisce la connessione."]}
 ]},
{ id:"wcsmusik", ico:"🎶", c:"var(--blue)", min:3,
 t:["West Coast Swing: Musik, Spiel und Stil","West Coast Swing : musique, jeu et style","West Coast Swing: Musig, Spiel und Stil","West Coast Swing: musica, gioco e stile"],
 sub:["Blues, Zufallspartner und der Mut zur Pause","Blues, partenaire tiré au sort et courage de la pause","Blues, Zuefallspartner und de Muet zur Pause","Blues, partner a sorte e il coraggio della pausa"],
 cards:[
  [["Musik und Tempo","Musique et tempo","Musig und Tempo","Musica e tempo"],
   ["West Coast Swing steht im 4/4-Takt. Traditionell ist Blues die Grundmusik, getanzt wird aber zu jeder Musik im 4/4-Takt. Die UCWDC-Regeln von 2014 bis 2016 nannten 102 bis 114 Schläge pro Minute, bevorzugt 108 BPM. Faustregel: ein Tempo, in dem du in Ruhe tripeln kannst.",
    "Le West Coast Swing se danse sur un rythme à 4 temps. Le blues est la musique traditionnelle, mais on peut danser sur toute musique à 4 temps. Les règles de l'UCWDC de 2014 à 2016 indiquaient 102 à 114 battements par minute, 108 BPM de préférence. Règle d'or : un tempo où tu peux faire tes triple steps tranquillement.",
    "West Coast Swing staht im 4/4-Takt. Traditionell isch Blues d Grundmusig, tanzt wird aber zu jeder Musig im 4/4-Takt. D UCWDC-Regle vo 2014 bis 2016 hend 102 bis 114 Schläg pro Minute gnännt, am liebschte 108 BPM. Faustregle: es Tempo, i dem du i Rueh chasch tripple.",
    "Il West Coast Swing è in 4/4. Tradizionalmente il blues è la musica di base, ma si balla su qualsiasi musica in 4/4. Le regole UCWDC dal 2014 al 2016 indicavano da 102 a 114 battiti al minuto, preferibilmente 108 BPM. Regola pratica: un tempo in cui puoi fare i tuoi triple step con calma."]],
  [["Jack and Jill","Jack and Jill","Jack and Jill","Jack and Jill"],
   ["Beim Jack and Jill werden Tanzpartner zufällig zusammengelost, und es darf keine vorab geplante Choreografie geben. Die Musik ist meist erst im Moment bekannt. Laut Wikipedia hat Jack Carey das Format in den frühen 1950er-Jahren in Norwalk, Kalifornien, erfunden. Alles ist Improvisation, der Humor inklusive.",
    "Au Jack and Jill, les partenaires sont tirés au sort et aucune chorégraphie préparée n'est permise. La musique n'est en général connue qu'au dernier moment. Selon Wikipédia, Jack Carey a créé ce format au début des années 1950 à Norwalk, en Californie. Tout est improvisation, humour compris.",
    "Bim Jack and Jill wärded d Tanzpartner zuefällig zämegloost, und es dörf kei vorgängig plant Choreografie gä. D Musig isch meischtens erscht im Momänt bekannt. Lut Wikipedia het de Jack Carey s Format i de frühe 1950er-Jahr z Norwalk, Kalifornie, erfunde. Alles isch Improvisation, de Humor inklusive.",
    "Nel Jack and Jill i partner vengono sorteggiati e non è ammessa alcuna coreografia preparata. La musica di solito si conosce solo all'ultimo momento. Secondo Wikipedia, Jack Carey ha creato questo formato all'inizio degli anni Cinquanta a Norwalk, in California. Tutto è improvvisazione, umorismo compreso."]],
  [["Spielen und Stilvergleich","Jouer et comparer les styles","Spiele und Stil vergliiche","Giocare e confrontare gli stili"],
   ["Musikalität heißt: Du hörst nicht nur den Beat, sondern auch Akzente und Pausen, und du spielst damit, statt nur Schritte abzuspulen. Im West Coast Swing läuft die folgende Person meist auf einer Linie hin und her, andere Tänze wie Jive kreisen eher. Discofox ist laut Dance Chance zu vielen Musikstilen tanzbar und kommt ohne feste Bahn aus.",
    "La musicalité, c'est entendre non seulement le beat mais aussi les accents et les pauses, et jouer avec, au lieu d'enchaîner des pas. Dans le West Coast Swing, la personne qui suit va en général et vient sur une ligne, alors que d'autres danses comme le jive tournent plutôt. Selon Dance Chance, le discofox se danse sur beaucoup de styles de musique et se passe d'une piste fixe.",
    "Musikalität heisst: Du ghörsch nöd nume de Beat, au Akzänt und Pause, und du spielsch demit, statt numme Schritt abzspule. Im West Coast Swing louft di folgendi Person meischtens uf ere Linie hin und her, anderi Täntz wie Jive drehed meh im Chreis. Discofox isch lut Dance Chance zu vilne Musigstil tanzbar und chunnt ohni feschti Bahn us.",
    "Musicalità significa: non senti solo il beat, ma anche accenti e pause, e ci giochi invece di eseguire passi a macchinetta. Nel West Coast Swing chi segue va di solito avanti e indietro su una linea, mentre altri balli come il jive girano di più. Secondo Dance Chance, il discofox si balla su molti stili di musica e non richiede una pista fissa."]]
 ],
 pro:["Gezählt wird das Basic 1, 2, 3 und 4, 5 und 6: zwei einzelne Schritte, dann zwei Triple Steps. Der letzte Triple (5 und 6) ist der Anker. Ein älterer Text nennt als Tempo 26 bis 32 Takte pro Minute, das sind 104 bis 128 BPM. Wer das Zählen im Kopf hat, kann an einer Stelle bewusst langsamer oder schneller treten und so mit der Musik spielen.",
  "Le basique se compte 1, 2, 3 et 4, 5 et 6 : deux pas simples, puis deux triple steps. Le dernier triple (5 et 6) est l'ancrage. Un ancien texte donne comme tempo 26 à 32 mesures par minute, soit 104 à 128 BPM. Quand tu as le compte en tête, tu peux ralentir ou accélérer un pas exprès et jouer ainsi avec la musique.",
  "Zählt wird s Basic 1, 2, 3 und 4, 5 und 6: zwöi einzelni Schritt, denn zwöi Triple Steps. De letscht Triple (5 und 6) isch de Anker. En ältere Text nennt as Tempo 26 bis 32 Takt pro Minute, das sind 104 bis 128 BPM. Wer s Zähle im Chopf het, cha a ere Stell bewusst langsamer oder schneller träte und so mit de Musig spiele.",
  "Il basic si conta 1, 2, 3 e 4, 5 e 6: due passi singoli, poi due triple step. L'ultimo triple (5 e 6) è l'ancora. Un testo più vecchio indica come tempo da 26 a 32 battute al minuto, cioè da 104 a 128 BPM. Se hai il conto in testa, puoi rallentare o accelerare un passo di proposito e giocare così con la musica."],
 fun:["Nastasia: Daric, listen to the music! Daric: Isch höre, isch höre! Die Musik sagt: Kaffee, ne?",
  "Nastasia : Daric, listen to the music ! Daric : Je l'entends, je l'entends ! La musique dit : café, non ?",
  "Nastasia: Daric, listen to the music! Daric: Isch ghöre, isch ghöre! D Musig seit: Kafi, gäll?",
  "Nastasia: Daric, listen to the music! Daric: Lo sento, lo sento, mon amie! La musica dice: caffè, no?"],

   e:["Blues ist die traditionelle Grundmusik, getanzt wird aber zu jeder Musik im 4/4-Takt.","Le blues est la musique de base traditionnelle, mais on danse sur toute musique à 4 temps.","Blues isch d traditionell Grundmusig, tanzt wird aber zu jeder Musig im 4/4-Takt.","Il blues è la musica di base tradizionale, ma si balla su qualsiasi musica in 4/4."]},
  {q:["Wie werden die Partner im Jack and Jill bestimmt?","Comment les partenaires sont-ils désignés au Jack and Jill ?","Wie wärded d Partner im Jack and Jill bestimmt?","Come vengono scelti i partner nel Jack and Jill?"],
   a:[["Sie werden zufällig zusammengelost","Ils sont tirés au sort","Si wärded zuefällig zämegloost","Vengono sorteggiati"],
      ["Man tanzt immer mit dem festen Partner","On danse toujours avec son partenaire fixe","Mer tanzt immer mit em feschte Partner","Si balla sempre con il partner fisso"],
      ["Die Judges suchen die Paare aus","Les juges choisissent les couples","D Judges sueched d Paar uus","I giudici scelgono le coppie"],
      ["Die Paare werden nach Schuhgröße gebildet","Les couples sont formés selon la pointure","D Paar wärded nach de Schuehgrössi bildet","Le coppie si formano in base al numero di scarpe"]],
   e:["Beim Jack and Jill wird zufällig gelost, und eine vorab geplante Choreografie ist nicht erlaubt.","Au Jack and Jill, on tire au sort, et aucune chorégraphie préparée n'est permise.","Bim Jack and Jill wird zuefällig gloost, und e vorgängig plant Choreografie isch nöd erlaubt.","Nel Jack and Jill si sorteggia e una coreografia preparata non è ammessa."]},
  {q:["Wie wird das West-Coast-Swing-Basic gezählt?","Comment compte-t-on le basique du West Coast Swing ?","Wie wird s West-Coast-Swing-Basic zählt?","Come si conta il basic del West Coast Swing?"],
   a:[["1, 2, 3 und 4, 5 und 6","1, 2, 3 et 4, 5 et 6","1, 2, 3 und 4, 5 und 6","1, 2, 3 e 4, 5 e 6"],
      ["1 und 2 und 3 und 4","1 et 2 et 3 et 4","1 und 2 und 3 und 4","1 e 2 e 3 e 4"],

   e:["Zwei einzelne Schritte, dann zwei Triple Steps: 1, 2, 3 und 4, 5 und 6. Das ist das Basic mit sechs Zählzeiten.","Deux pas simples, puis deux triple steps : 1, 2, 3 et 4, 5 et 6. C'est le basique à six temps.","Zwöi einzelni Schritt, denn zwöi Triple Steps: 1, 2, 3 und 4, 5 und 6. Das isch s Basic mit sächs Zählzyte.","Due passi singoli, poi due triple step: 1, 2, 3 e 4, 5 e 6. È il basic a sei tempi."]}

{ id:"turnier", ico:"⚖️", c:"var(--gold-ink)", min:3,
 t:["Turnier und Wertung: so denken Judges","Compétition et notation : comment pensent les juges","Turnier und Wertig: so dänked d Judges","Gara e valutazione: come pensano i giudici"],
 sub:["Von Newcomer bis Champion, ganz ohne Schuhfarben-Wertung","De Newcomer à Champion, sans note pour la couleur des chaussures","Vo Newcomer bis Champion, ganz ohni Schuehfarb-Wertig","Da Newcomer a Champion, senza punti per il colore delle scarpe"],
 cards:[
  [["Die WSDC-Stufen","Les niveaux WSDC","D WSDC-Stufe","I livelli WSDC"],
   ["Im WSDC-Register gibt es sechs Stufen: Newcomer, Novice, Intermediate, Advanced, All-Star und Champion. Wer im Jack and Jill gut platziert ist, sammelt Punkte und steigt irgendwann auf. Die Punkte hängen von der Platzierung im Finale und vom Tier ab, also von der Zahl der Teilnehmenden in deiner Rolle.",
    "Le registre WSDC compte six niveaux : Newcomer, Novice, Intermediate, Advanced, All-Star et Champion. Si tu te classes bien au Jack and Jill, tu récoltes des points et tu montes un jour de niveau. Les points dépendent de ta place en finale et du tier, c'est-à-dire du nombre de participants dans ton rôle.",
    "Im WSDC-Register git s sächs Stufe: Newcomer, Novice, Intermediate, Advanced, All-Star und Champion. Wer im Jack and Jill guet platziert isch, sammlet Punkt und stiigt irgendwenn uf. D Punkt hänged vo de Platzierig im Final und vom Tier ab, also vo de Zahl vo de Teilnehmende i dinere Rolle.",
    "Il registro WSDC prevede sei livelli: Newcomer, Novice, Intermediate, Advanced, All-Star e Champion. Se ti piazzi bene nel Jack and Jill, raccogli punti e prima o poi sali di livello. I punti dipendono dal piazzamento in finale e dal tier, cioè dal numero di partecipanti nel tuo ruolo."]],
  [["Was Judges sehen","Ce que voient les juges","Was d Judges gsähnd","Cosa vedono i giudici"],
   ["Die WSDC-Judge-Schulung nennt vier Dinge, die Judges zusammen betrachten: Technik, Musikalität, Partnerschaft und Showmanship, also Präsentation. Gewertet wird nach Relative Placement: Die besten Tanzenden sollen am Ende dort stehen, wo sie hingehören. Dein Lächeln zählt nicht als Kriterium, hilft aber garantiert dem Partner.",
    "La formation des juges WSDC cite quatre choses que les juges examinent ensemble : technique, musicalité, partenariat et showmanship, donc présentation. La notation suit le Relative Placement : les meilleurs danseurs doivent finir là où ils méritent d'être. Ton sourire n'est pas un critère, mais il aide à coup sûr ton partenaire.",
    "D WSDC-Judge-Schulig nennt vier Sache, wo d Judges zämme aaluege: Technik, Musikalität, Partnerschaft und Showmanship, also Präsentation. Gwertet wird nach Relative Placement: D beschte Tanzende sölled am Schluss det stah, wo si highöred. Dis Lächle zellt nöd als Kriterium, hilft aber garantiert dim Partner.",
    "La formazione dei giudici WSDC indica quattro cose che i giudici valutano insieme: tecnica, musicalità, partnership e showmanship, cioè presentazione. Si giudica con il Relative Placement: i ballerini migliori devono finire dove meritano. Il tuo sorriso non è un criterio, ma aiuta di sicuro il partner."]],
  [["Daric am Richtertisch","Daric à la table des juges","De Daric am Richtertisch","Daric al tavolo dei giudici"],
   ["Daric richtet laut Profil (Stand 2013) seit 2006. Im Jack and Jill wird jede Person einzeln bewertet, Kostüme sind nicht erlaubt, Hebefiguren meist verboten, und manche Events lassen neu losen, wenn du deinen festen Partner ziehst. Fairness heißt: gleiche Regeln für alle, und der Tanz zählt, nicht die Schuhe.",
    "Daric juge depuis 2006 selon son profil (état 2013). Au Jack and Jill, chaque personne est jugée individuellement, les costumes ne sont pas permis, les portés sont en général interdits, et certains événements font retirer au sort si tu tombes sur ton partenaire habituel. L'équité, c'est les mêmes règles pour tous, et c'est la danse qui compte, pas les chaussures.",
    "De Daric richtet lut Profil (Stand 2013) sit 2006. Im Jack and Jill wird jedi Person einzeln bewertet, Kostüm sind nöd erlaubt, Hebefigure meischtens verbote, und es paar Events looset neu, wenn du dä feschte Partner ziehsch. Fairness heisst: gliichi Regle für alli, und de Tanz zellt, nöd d Schueh.",
    "Secondo il suo profilo (stato 2013), Daric giudica dal 2006. Nel Jack and Jill ogni persona è valutata singolarmente, i costumi non sono ammessi, i sollevamenti sono di solito vietati e alcuni eventi ripetono il sorteggio se ti capita il tuo partner abituale. Equità significa: stesse regole per tutti, e conta il ballo, non le scarpe."]]
 ],
 pro:["Leader und Follower zählen getrennt: Die Punkte werden für jede Rolle einzeln gesammelt, und jede Stufe hat ihren eigenen Zähler. Mindestens ein Punkt, und du erscheinst im Register. Beispiel laut einer Übersicht von Westie Babies: Ein Sieg in Tier 1 (5 bis 10 Teilnehmende pro Rolle) bringt 3 Punkte, in Tier 6 (ab 130) sind es 25. Die genauen Aufstiegsgrenzen prüfst du immer in den aktuellen WSDC-Regeln.",
  "Leaders et followers comptent séparément : les points s'accumulent pour chaque rôle, et chaque niveau a son propre compteur. Un point suffit pour apparaître dans le registre. Exemple d'après un aperçu de Westie Babies : une victoire en tier 1 (5 à 10 participants par rôle) rapporte 3 points, en tier 6 (à partir de 130) c'en est 25. Vérifie toujours les seuils exacts dans les règles WSDC actuelles.",
  "Leader und Follower zähled getrennt: D Punkt wärded für jedi Rolle einzeln gsammlet, und jedi Stufe het ihre eigene Zähler. Mindestens en Punkt, und du erschiinsch im Register. Bispil lut ere Übersicht vo Westie Babies: En Sieg im Tier 1 (5 bis 10 Teilnehmendi pro Rolle) bringt 3 Punkt, im Tier 6 (ab 130) sind es 25. D genaue Ufstiegsgränze prüefsch immer i de aktuelle WSDC-Regle.",
  "Leader e follower contano separatamente: i punti si accumulano per ogni ruolo e ogni livello ha il proprio contatore. Basta un punto per comparire nel registro. Esempio secondo una panoramica di Westie Babies: una vittoria nel tier 1 (da 5 a 10 partecipanti per ruolo) vale 3 punti, nel tier 6 (da 130 in su) sono 25. Controlla sempre le soglie esatte nelle regole WSDC attuali."],
 fun:["Daric: Als Judge isch sehe alles: die Füße, die Musik, das Lächeln! Nastasia: And your keys? Not seen, Daric.",
  "Daric : En tant que juge, je vois tout : les pieds, la musique, le sourire ! Nastasia : Et tes clés ? Pas vues, Daric.",
  "Daric: Als Judge isch sehe alles, bon: d Füess, d Musig, s Lächle! Nastasia: And your keys? Not seen, Daric.",
  "Daric: Come giudice vedo tutto: i piedi, la musica, il sorriso! Nastasia: E le tue chiavi? Not seen, Daric."],

  {q:["Welche vier Kriterien nennt die WSDC-Judge-Schulung?","Quels quatre critères la formation des juges WSDC cite-t-elle ?","Weli vier Kriterie nennt d WSDC-Judge-Schulig?","Quali quattro criteri cita la formazione dei giudici WSDC?"],

      ["Kostüm, Schuhfarbe, Dekoration, Applaus","Costume, chaussures, décor, applaudissements","Kostüm, Schuehfarb, Dekoration, Applaus","Costume, colore delle scarpe, decorazione, applausi"],

   e:["Technik, Musikalität, Partnerschaft und Showmanship betrachten Judges zusammen. Kostüme sind im Jack and Jill sogar nicht erlaubt.","Les juges regardent ensemble technique, musicalité, partenariat et showmanship. Les costumes sont même interdits au Jack and Jill.","Technik, Musikalität, Partnerschaft und Showmanship luege d Judges zämme aa. Kostüm sind im Jack and Jill sogar nöd erlaubt.","I giudici guardano insieme tecnica, musicalità, partnership e showmanship. I costumi nel Jack and Jill sono perfino vietati."]},
  {q:["Wovon hängen WSDC-Punkte ab?","De quoi dépendent les points WSDC ?","Wovo hänged WSDC-Punkt ab?","Da cosa dipendono i punti WSDC?"],

      ["Von der Länge des Tanzes","De la durée de la danse","Vo de Längi vom Tanz","Dalla durata del ballo"],
